  #     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  #     TELEGRAM_BOT_TOKEN: ${JOBS_BOT_TOKEN}
  #     TELEGRAM_BOT_USERNAME: ${JOBS_BOT_USERNAME}
  #     TELEGRAM_CHANNEL_ID: ${JOBS_CHANNEL_ID}
  #     SERVER_PORT: 8081

volumes:
  postgres_data: